name: Build and publish

on:
  workflow_call:
    inputs:
      workspace:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # no dependency cache in the release job (cache poisoning hardening)
          package-manager-cache: false

      - run: npm ci
      - run: npm test
      # builds all workspaces in the order listed in package.json (openapi first, which swagger and
      # create-api-docs depend on); replaces the former depends_on input
      - run: npm run build

      - run: npm publish -w ${{ inputs.workspace }} --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
